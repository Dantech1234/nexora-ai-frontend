<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexora AI</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<!-- ======================
AUTH SCREEN
====================== -->
<div id="auth" class="auth">

  <h2>Nexora AI Login</h2>

  <!-- INLINE ERROR DISPLAY (IMPORTANT FOR NEW APP.JS) -->
  <div id="auth-error" class="auth-error"></div>

  <!-- AUTH INPUTS -->
  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />

  <!-- AUTH BUTTONS (MUST MATCH app.js IDs) -->
  <button id="loginBtn" onclick="login()">Login</button>
  <button id="signupBtn" onclick="signup()">Sign Up</button>

</div>

<!-- ======================
MAIN APP
====================== -->
<div id="app" class="app hidden">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">Nexora AI</div>

    <button onclick="newChat()">+ New Chat</button>

    <div class="history-title">Conversations</div>
    <div id="history"></div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat">

    <div id="messages" class="messages"></div>

    <div class="input-area">
      <input id="input" placeholder="Message..." onkeydown="handleKey(event)"/>
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
